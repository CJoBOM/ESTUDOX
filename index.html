<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESTUDOX</title>
<style>
:root{color-scheme:light dark;--site-primary:#245b4f;--site-secondary:#dcece5;--site-background:#f4f7f5;--site-on-primary:#ffffff;--site-on-secondary:#163a32;--site-on-background:#182522;--site-font-body:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--site-font-heading:Inter,ui-sans-serif,system-ui,sans-serif;--site-heading-scale:1;--site-spacing-scale:1;--site-radius-scale:1;--site-decoration-opacity:1}
*{box-sizing:border-box}body{margin:0;background:light-dark(#f4f7f5,#101715);color:light-dark(#182522,#e7efeb);font-family:var(--site-font-body)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid light-dark(#d8e2dd,#33443d);background:light-dark(#fff,#1c2823);color:inherit;border-radius:calc(12px * var(--site-radius-scale));padding:9px 12px}button:hover{border-color:var(--site-primary)}.app{min-height:100vh;background:light-dark(#f4f7f5,#101715)}.top{background:var(--site-primary);color:var(--site-on-primary);padding:25px max(20px,calc((100vw - 1200px)/2));display:flex;justify-content:space-between;gap:20px;align-items:center}.brand{font-size:26px;font-weight:850;letter-spacing:.08em}.top p{margin:6px 0 0;opacity:.85}.top .chip{border:1px solid #ffffff66;border-radius:999px;padding:8px 12px;font-size:13px}.shell{max-width:1200px;margin:auto;padding:24px 20px 50px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.nav button.active{background:var(--site-primary);color:white;border-color:var(--site-primary)}.welcome{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:20px}.welcome h1{font-size:calc(30px * var(--site-heading-scale));margin:0 0 6px}.muted{color:light-dark(#62716b,#a7b8af)}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}.metric,.panel,.study-card{background:light-dark(#fff,#1a2520);border:1px solid light-dark(#e0e8e3,#2d3a34);border-radius:calc(16px * var(--site-radius-scale));padding:17px}.metric .num{font-size:28px;font-weight:800;margin:8px 0 4px}.metric .label{font-size:13px;color:light-dark(#68776f,#a8b9b0)}.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.panel h2{font-size:18px;margin:0 0 14px}.panel-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.progress{height:8px;border-radius:999px;background:light-dark(#e6ede8,#2a3730);overflow:hidden}.progress span{height:100%;display:block;background:#5ca58a;width:0;transition:width .2s}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.filters input,.filters select,.field input,.field select,.field textarea{min-width:0;width:100%;border:1px solid light-dark(#d8e2dd,#33443d);background:light-dark(#fff,#111a16);color:inherit;border-radius:10px;padding:10px}.filters input{flex:1;min-width:180px}.list{display:grid;gap:9px}.study-card{padding:13px;display:flex;gap:12px;align-items:flex-start}.study-card .body{flex:1;min-width:0}.study-card strong{display:block;margin-bottom:5px}.study-card small{color:light-dark(#68776f,#a8b9b0)}.study-card select{margin-top:8px;border:1px solid light-dark(#d8e2dd,#33443d);background:transparent;color:inherit;padding:6px;border-radius:8px}.tag{display:inline-block;font-size:11px;padding:4px 8px;border-radius:999px;background:light-dark(#e8f2ed,#243c31);color:light-dark(#245b4f,#b7e3d0);margin:2px 4px 2px 0}.empty{padding:22px;text-align:center;color:light-dark(#68776f,#a8b9b0)}.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:13px;font-weight:700}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn-primary{background:var(--site-primary);color:white;border-color:var(--site-primary)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid light-dark(#e2e9e5,#2d3a34);white-space:nowrap}th{color:light-dark(#62716b,#a7b8af);font-weight:650}.small-btn{padding:6px 8px;font-size:12px}.note{min-height:90px}.barrow{display:grid;grid-template-columns:110px 1fr 45px;align-items:center;gap:10px;margin:12px 0;font-size:13px}.barrow .progress{height:10px}.footer{text-align:center;margin-top:22px;font-size:12px;color:light-dark(#68776f,#a8b9b0)}@media(max-width:800px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:1fr}.welcome{align-items:flex-start;flex-direction:column}.top{align-items:flex-start;flex-direction:column}}@media(max-width:460px){.metrics{grid-template-columns:1fr 1fr}.metric{padding:12px}.metric .num{font-size:23px}.shell{padding:17px 12px 35px}.two{grid-template-columns:1fr}}
</style></head><body><div class="app"><header class="top"><div><div class="brand">ESTUDOX</div><p>Seu espaço de estudos, revisões e evolução.</p></div><span class="chip">2º ano → 3º ano + ENEM</span></header><main class="shell"><nav class="nav" id="nav"><button class="active" data-tab="home">Visão geral</button><button data-tab="topics">Matérias e conteúdos</button><button data-tab="tasks">Lista de estudos</button><button data-tab="reviews">Revisões</button><button data-tab="performance">Desempenho</button><button data-tab="notes">Anotações</button></nav><section id="view"></section><div class="footer">Protótipo interativo • Os dados ficam neste protótipo e não sincronizam automaticamente com o Notion.</div></main></div>
<script>
const seedTopics=[
['Matemática','Porcentagem, razão, proporção, equações e funções','2º ano — construir base','A fazer'],['Matemática','Progressões, geometria e matemática financeira','2º ano — construir base','A fazer'],['Física','Cinemática, leis de Newton, trabalho, energia e potência','2º ano — construir base','A fazer'],['Biologia','Citologia, metabolismo, ecologia e classificação','2º ano — construir base','A fazer'],['Química','Estrutura atômica, tabela periódica, ligações e estequiometria','2º ano — construir base','A fazer'],['Português','Interpretação, gêneros textuais, gramática e literatura','2º ano — construir base','A fazer'],['Redação','Estrutura dissertativo-argumentativa, tese e argumentos','2º ano — construir base','A fazer'],['História','Brasil Colônia, Império e temas da escola','2º ano — construir base','A fazer'],['Geografia','Cartografia, população, urbanização e meio ambiente','2º ano — construir base','A fazer'],['Matemática','Funções exponenciais/logarítmicas, trigonometria e geometria','Transição para o 3º ano','A fazer'],['Física','Calorimetria, termodinâmica, ondas e óptica','Transição para o 3º ano','A fazer'],['Biologia','Fisiologia humana, genética, evolução e reprodução','Transição para o 3º ano','A fazer'],['Química','Soluções, termoquímica, cinética, equilíbrio e orgânica','Transição para o 3º ano','A fazer'],['Linguagens','Literatura, coesão, argumentação e interpretação','Transição para o 3º ano','A fazer'],['Humanas','República, industrialização, globalização e geopolítica','Transição para o 3º ano','A fazer'],['Matemática','Estatística, probabilidade, combinatória e revisão de funções','3º ano — consolidar','A fazer'],['Física','Eletricidade, circuitos, magnetismo e revisão de mecânica','3º ano — consolidar','A fazer'],['Biologia','Biotecnologia, saúde, impactos ambientais e revisão geral','3º ano — consolidar','A fazer'],['Química','Ácidos e bases, eletroquímica, orgânica e revisão geral','3º ano — consolidar','A fazer'],['Redação','Redação completa, competências, repertório e intervenção','3º ano — consolidar','A fazer'],['Filosofia e Sociologia','Ética, política, cultura, trabalho e cidadania','Todas as fases','A fazer'],['Inglês/Espanhol','Interpretação, vocabulário em contexto e leitura','Todas as fases','A fazer'],['Artes','Linguagens artísticas, movimentos e leitura de imagens','Todas as fases','A fazer']].map((a,i)=>({id:i+1,subject:a[0],content:a[1],phase:a[2],status:a[3],notes:''}));
const seedTasks=[['Estudar o conteúdo atual da aula','Matemática','Segunda','Alta',45],['Resolver exercícios do conteúdo atual','Física','Segunda','Alta',40],['Revisar conceitos e desenhar esquema','Biologia','Terça','Média',45],['Resolver exercícios e cálculos','Química','Terça','Alta',40],['Treinar interpretação de texto','Português','Quarta','Média',45],['Produzir ou revisar uma redação','Redação','Quarta','Alta',40],['Revisar um tema de História','História','Quinta','Média',45],['Interpretar mapas e gráficos','Geografia','Quinta','Média',40],['Corrigir os erros da semana','Revisão','Sexta','Alta',45],['Resolver questões do ENEM','Interdisciplinar','Sexta','Alta',40],['Revisar Filosofia/Sociologia/Inglês/Espanhol/Artes','Outras áreas','Sexta','Baixa',20]].map((a,i)=>({id:i+1,title:a[0],subject:a[1],day:a[2],priority:a[3],minutes:a[4],status:'Pendente',questions:0,correct:0,date:'',nextReview:'',notes:''}));
let state={tab:'home',topics:seedTopics,tasks:seedTasks,reviews:[],scores:[],notes:'',filter:'Todos',search:''};
try{const saved=localStorage.getItem('estudox-v1');if(saved){const parsed=JSON.parse(saved);state={...state,...parsed,tab:'home'}}}catch(e){}function save(){try{localStorage.setItem('estudox-v1',JSON.stringify(state))}catch(e){}}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function done(){return state.topics.filter(t=>['Estudado','Dominado'].includes(t.status)).length}function progress(){return Math.round(done()/Math.max(1,state.topics.length)*100)}function nav(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab))}function metric(label,num,sub){return `<div class="metric"><div class="label">${label}</div><div class="num">${num}</div><div class="label">${sub}</div></div>`}function topicList(items){if(!items.length)return '<div class="empty">Nenhum conteúdo encontrado. Tente mudar os filtros.</div>';return `<div class="list">${items.map(t=>`<article class="study-card"><div class="body"><strong>${esc(t.content)}</strong><small>${esc(t.subject)} · ${esc(t.phase)}</small><div style="margin-top:7px"><span class="tag">${esc(t.status)}</span></div><select aria-label="Status do conteúdo" onchange="setTopic(${t.id},this.value)">${['A fazer','Estudando','Estudado','Revisar','Dominado'].map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select><button class="small-btn" onclick="topicNote(${t.id})">Anotar</button></div></article>`).join('')}</div>`}
function taskList(items) {
  if (!items.length) {
    return '<div class="empty">Nenhuma tarefa corresponde ao filtro.</div>';
  }

  return `<div class="list">${items.map(t => `
    <article class="study-card">
      <div class="body">
        <strong>${esc(t.title)}</strong>

        <small>
          ${esc(t.subject)} · ${esc(t.day)} · ${t.minutes} min
        </small>

        <small>
          Prazo: ${t.deadline ? esc(t.deadline) : 'Não definido'}
        </small>

        <div style="margin-top:7px">
          <span class="tag">${esc(t.priority)}</span>
          <span class="tag">${esc(t.status)}</span>
        </div>

        <select aria-label="Status da tarefa"
          onchange="setTask(${t.id},this.value)">
          ${['Pendente','Em andamento','Concluída','Adiada']
            .map(s => `<option ${s === t.status ? 'selected' : ''}>${s}</option>`)
            .join('')}
        </select>

        <button class="small-btn"
          onclick="editTask(${t.id})">
          Registrar questões
        </button>

        <button class="small-btn"
          onclick="editTaskDetails(${t.id})">
          Editar tarefa
        </button>

        <button class="small-btn"
          onclick="deleteTask(${t.id})">
          Excluir tarefa
        </button>
      </div>
    </article>
  `).join('')}</div>`;
}
function home(){let openReviews=state.reviews.filter(r=>!r.done).length;return `<div class="welcome"><div><h1>Bom estudo! 👋</h1><div class="muted">Um passo de cada vez. Registre o que estudou e volte nos assuntos que precisam de reforço.</div></div><button class="btn-primary" onclick="state.tab='tasks';render()">+ Nova sessão</button></div><div class="metrics">${metric('Conteúdos concluídos',`${done()} / ${state.topics.length}`,`${progress()}% do roteiro`)}${metric('Tarefas concluídas',state.tasks.filter(t=>t.status==='Concluída').length,`${state.tasks.length} tarefas no modelo`)}${metric('Revisões pendentes',openReviews,'Agende 1, 7 e 30 dias')}${metric('Questões respondidas',state.scores.reduce((s,x)=>s+(+x.questions||0),0),'Registre seus resultados')}</div><div class="panel" style="margin-bottom:16px"><div class="panel-head"><h2>Progresso geral do roteiro</h2><b>${progress()}%</b></div><div class="progress"><span style="width:${progress()}%"></span></div><p class="muted" style="font-size:13px">Marque os conteúdos como Estudado ou Dominado para atualizar seu progresso.</p></div><div class="layout"><div class="panel"><div class="panel-head"><h2>Continue de onde parou</h2><button class="small-btn" onclick="state.tab='topics';render()">Ver todos</button></div>${topicList(state.topics.filter(t=>['Estudando','Revisar'].includes(t.status)).slice(0,4).concat(state.topics.filter(t=>t.status==='A fazer').slice(0,2)))}</div><div class="panel"><div class="panel-head"><h2>Próximas ações</h2></div><p>🗓️ <b>Segunda:</b> Matemática + Física</p><p>🧬 <b>Terça:</b> Biologia + Química</p><p>📚 <b>Quarta:</b> Português + Redação/Literatura</p><p>🌍 <b>Quinta:</b> História + Geografia</p><p>🎯 <b>Sexta:</b> corrigir erros + questões ENEM</p><hr style="border:0;border-top:1px solid #d8e2dd;margin:18px 0"><h2>Rotina de 2 horas</h2><p class="muted">10 min revisão ativa · 45 min assunto 1 · 5 min pausa · 40 min assunto 2 · 20 min correção e registro.</p></div></div>`}function topics(){let arr=state.topics.filter(t=>(state.filter==='Todos'||t.status===state.filter)&&(t.content+' '+t.subject+' '+t.phase).toLowerCase().includes(state.search.toLowerCase()));return `<div class="welcome"><div><h1>Matérias e conteúdos</h1><div class="muted">Marque o que já estudou e identifique os temas para revisar.</div></div><button class="btn-primary" onclick="addTopic()">+ Adicionar conteúdo</button></div><div class="panel"><div class="filters"><input placeholder="Buscar matéria ou assunto…" value="${esc(state.search)}" onchange="state.search=this.value;render()"><select onchange="state.filter=this.value;render()">${['Todos','A fazer','Estudando','Estudado','Revisar','Dominado'].map(s=>`<option ${s===state.filter?'selected':''}>${s}</option>`).join('')}</select></div><div class="muted" style="margin-bottom:12px;font-size:13px">${arr.length} conteúdo(s) exibido(s)</div>${topicList(arr)}</div>`}function tasks(){let arr=state.tasks.filter(t=>(state.filter==='Todos'||t.status===state.filter)&&(t.title+' '+t.subject+' '+t.day).toLowerCase().includes(state.search.toLowerCase()));return `<div class="welcome"><div><h1>Lista de estudos</h1><div class="muted">Organize suas sessões, prazos, questões e notas.</div></div><button class="btn-primary" onclick="addTask()">+ Nova tarefa</button></div><div class="panel"><div class="filters"><input placeholder="Buscar tarefa ou matéria…" value="${esc(state.search)}" onchange="state.search=this.value;render()"><select onchange="state.filter=this.value;render()">${['Todos','Pendente','Em andamento','Concluída','Adiada'].map(s=>`<option ${s===state.filter?'selected':''}>${s}</option>`).join('')}</select></div>${taskList(arr)}</div>`}function reviews(){return `<div class="welcome"><div><h1>Revisões</h1><div class="muted">Use repetição espaçada para fixar os assuntos estudados.</div></div><button class="btn-primary" onclick="addReview()">+ Agendar revisão</button></div><div class="panel"><div class="muted" style="font-size:13px;margin-bottom:12px">Modelo sugerido: revisar 1 dia, 7 dias e 30 dias após o estudo. As datas precisam ser preenchidas por você.</div>${state.reviews.length?`<div class="table-wrap"><table><thead><tr><th>Conteúdo</th><th>Matéria</th><th>Data</th><th>Intervalo</th><th>Resultado</th><th></th></tr></thead><tbody>${state.reviews.map((r,i)=>`<tr><td>${esc(r.content)}</td><td>${esc(r.subject)}</td><td>${esc(r.date||'Sem data')}</td><td>${esc(r.interval)}</td><td>${r.done?'Concluída':'Pendente'}</td><td><button class="small-btn" onclick="toggleReview(${i})">${r.done?'Reabrir':'Concluir'}</button> <button class="small-btn" onclick="removeReview(${i})">Excluir</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Ainda não há revisões agendadas. Clique em “Agendar revisão” para começar.</div>'}</div>`}function performance(){let total=state.scores.reduce((s,x)=>s+(+x.questions||0),0),correct=state.scores.reduce((s,x)=>s+(+x.correct||0),0),pct=total?Math.round(correct/total*100):0;return `<div class="welcome"><div><h1>Desempenho</h1><div class="muted">Acompanhe seus exercícios e descubra quais assuntos precisam de atenção.</div></div><button class="btn-primary" onclick="addScore()">+ Registrar treino</button></div><div class="metrics">${metric('Questões',total,'registradas')}${metric('Acertos',correct,'no total')}${metric('Aproveitamento',pct+'%','acertos ÷ questões')}${metric('Treinos registrados',state.scores.length,'sessões de exercícios')}</div><div class="panel">${state.scores.length?`<div class="table-wrap"><table><thead><tr><th>Data</th><th>Matéria / conteúdo</th><th>Questões</th><th>Acertos</th><th>%</th><th>Próxima ação</th></tr></thead><tbody>${state.scores.map((s,i)=>`<tr><td>${esc(s.date||'—')}</td><td>${esc(s.subject)} · ${esc(s.content)}</td><td>${s.questions}</td><td>${s.correct}</td><td>${s.questions?Math.round(s.correct/s.questions*100):0}%</td><td>${esc(s.action||'Revisar erros')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Registre seu primeiro treino para ver o progresso aqui.</div>'}</div>`}function notes(){return `<div class="welcome"><div><h1>Anotações</h1><div class="muted">Use este espaço como diário de estudo, dúvidas e metas da semana.</div></div><button class="btn-primary" onclick="saveNotes()">Salvar anotações</button></div><div class="panel"><div class="field"><label>Meu diário de estudos</label><textarea id="notes" class="note" placeholder="O que aprendi hoje? O que ainda não entendi? Qual será minha próxima ação?">${esc(state.notes)}</textarea></div><button class="btn-primary" onclick="saveNotes()">Salvar</button></div>`}function render(){nav();let v=document.getElementById('view');v.innerHTML=({home,topics,tasks,reviews,performance,notes}[state.tab]||home)();save()}document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-tab]');if(b){state.tab=b.dataset.tab;state.filter='Todos';state.search='';render()}});function setTopic(id,status){let t=state.topics.find(x=>x.id===id);if(t){t.status=status;if(status==='Estudado'||status==='Dominado'){['1 dia','7 dias','30 dias'].forEach(interval=>{if(!state.reviews.some(r=>r.content===t.content&&r.interval===interval))state.reviews.push({content:t.content,subject:t.subject,date:'',interval,done:false})})}}render()}function setTask(id,status){let t=state.tasks.find(x=>x.id===id);if(t)t.status=status;render()}function topicNote(id){let t=state.topics.find(x=>x.id===id);let n=prompt('Anotações para: '+t.content,t.notes||'');if(n!==null){t.notes=n;save()}}function addTopic(){let subject=prompt('Matéria:');if(!subject)return;let content=prompt('Conteúdo:');if(!content)return;state.topics.push({id:Date.now(),subject,content,phase:'2º ano — construir base',status:'A fazer',notes:''});render()}
function addTask() {
  const title = prompt('Nome da tarefa:');
  if (!title || !title.trim()) return;

  const subject = prompt('Matéria:', 'Matemática');
  if (!subject || !subject.trim()) return;

  const day = prompt(
    'Dia planejado (ex.: Segunda):',
    'Segunda'
  );
  if (!day || !day.trim()) return;

  const priority = prompt(
    'Prioridade: Alta, Média ou Baixa',
    'Média'
  );
  if (!priority) return;

  const minutesInput = prompt(
    'Tempo estimado em minutos:',
    '40'
  );
  if (minutesInput === null) return;

  const minutes = Number(minutesInput);
  if (!Number.isFinite(minutes) || minutes <= 0) {
    alert('Digite um tempo válido em minutos.');
    return;
  }

  const deadline = prompt(
    'Prazo (AAAA-MM-DD), ou deixe vazio:',
    ''
  );

  if (deadline && !/^\d{4}-\d{2}-\d{2}$/.test(deadline)) {
    alert('Use o formato AAAA-MM-DD para o prazo.');
    return;
  }

  state.tasks.push({
    id: Date.now(),
    title: title.trim(),
    subject: subject.trim(),
    day: day.trim(),
    priority: ['Alta', 'Média', 'Baixa'].includes(priority)
      ? priority
      : 'Média',
    minutes,
    deadline: deadline || '',
    status: 'Pendente',
    questions: 0,
    correct: 0,
    date: '',
    nextReview: '',
    notes: ''
  });

  render();
}
;if(!title)return;let subject=prompt('Matéria:','Matemática')||'Outra';state.tasks.push({id:Date.now(),title,subject,day:'Sexta',priority:'Média',minutes:40,status:'Pendente',questions:0,correct:0,date:'',nextReview:'',notes:''});render()}function editTask(id){let t=state.tasks.find(x=>x.id===id);let q=prompt('Quantas questões fez?',t.questions||0);if(q===null)return;let c=prompt('Quantos acertos?',t.correct||0);if(c===null)return;t.questions=Math.max(0,+q||0);t.correct=Math.min(t.questions,Math.max(0,+c||0));let n=prompt('Anotações / dúvidas:',t.notes||'');if(n!==null)t.notes=n;state.scores.push({date:new Date().toISOString().slice(0,10),subject:t.subject,content:t.title,questions:t.questions,correct:t.correct,action:t.notes?'Rever: '+t.notes:'Refazer questões erradas'});render()}function addReview(){let content=prompt('Qual conteúdo vai revisar?');if(!content)return;let subject=prompt('Matéria:','Matemática')||'Outra';let interval=prompt('Intervalo (1 dia, 7 dias ou 30 dias):','7 dias')||'7 dias';let date=prompt('Data da revisão (AAAA-MM-DD):','');state.reviews.push({content,subject,interval,date:date||'',done:false});render()}function toggleReview(i){state.reviews[i].done=!state.reviews[i].done;render()}function removeReview(i){if(confirm('Excluir esta revisão?')){state.reviews.splice(i,1);render()}}function addScore(){let subject=prompt('Matéria:');if(!subject)return;let content=prompt('Conteúdo estudado:')||'Treino geral';let questions=Math.max(0,+prompt('Número de questões:','10')||0);let correct=Math.min(questions,Math.max(0,+prompt('Número de acertos:','0')||0));let action=prompt('O que revisar depois?','Refazer questões erradas')||'';state.scores.push({date:new Date().toISOString().slice(0,10),subject,content,questions,correct,action});render()}function saveNotes(){let el=document.getElementById('notes');if(el)state.notes=el.value;save();alert('Anotações salvas neste protótipo.')}render();

  
function deleteTask(id) {
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;

  if (!confirm(`Excluir a tarefa "${t.title}"?`)) {
    return;
  }

  state.tasks = state.tasks.filter(x => x.id !== id);
  render();
}

function taskList(items) {
  if (!items.length) {
    return '<div class="empty">Nenhuma tarefa corresponde ao filtro.</div>';
  }

  return `<div class="list">${items.map(t => `
    <article class="study-card">
      <div class="body">
        <strong>${esc(t.title)}</strong>

        <small>
          ${esc(t.subject)} · ${esc(t.day)} · ${t.minutes} min
        </small>

        <small>
          Prazo: ${t.deadline ? esc(t.deadline) : 'Não definido'}
        </small>

        <div style="margin-top:7px">
          <span class="tag">${esc(t.priority)}</span>
          <span class="tag">${esc(t.status)}</span>
        </div>

        <select aria-label="Status da tarefa"
          onchange="setTask(${t.id},this.value)">
          ${['Pendente','Em andamento','Concluída','Adiada']
            .map(s => `<option ${s === t.status ? 'selected' : ''}>${s}</option>`)
            .join('')}
        </select>

        <button class="small-btn"
          onclick="editTask(${t.id})">
          Registrar questões
        </button>

        <button class="small-btn"
          onclick="editTaskDetails(${t.id})">
          Editar tarefa
        </button>

        <button class="small-btn"
          onclick="deleteTask(${t.id})">
          Excluir tarefa
        </button>
      </div>
    </article>
  `).join('')}</div>`;
}
